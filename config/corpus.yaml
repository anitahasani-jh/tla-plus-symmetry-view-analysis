# Benchmark pool for SymView.
#
# This file is the *pool*, not the evaluated subset. The evaluated subset is
# produced by experiments/select_subset.py from this pool using the
# pre-registered criterion written below, and is frozen in config/subset.yaml
# before any SymView run is inspected.
#
# Every entry is pinned to an exact commit so that the corpus is reproducible.
# Files are fetched over HTTPS from raw.githubusercontent.com and hashed
# (SHA-256) into benchmarks/PROVENANCE.json.

selection_criterion: |
  Pre-registered subset selection (fixed before looking at any SymView result):
    P1 Provenance: the model comes from a public repository pinned in this file,
       ships a .cfg next to its root module, and is redistributed under its
       original MIT licence with attribution.
    P2 Runnability: TLC (version pinned in config/tools.yaml) completes the
       unreduced baseline with verdict "ok" or "violation" within the probe
       budget (timeout_probe_s). Models that fail to parse, crash, or need
       hand-edited configurations are excluded and listed with the reason.
    P3 Family diversity: keep at least one model from each of these families --
       consensus, transaction commit, mutual exclusion, termination detection,
       cache coherence, allocation/scheduling, ring/token protocols,
       auxiliary-variable examples, and "integer-indexed" examples (which are
       expected to have NO usable symmetry set and therefore measure the
       false-positive/coverage side of the method).
    P4 Cost spread: the subset must contain at least 4 models whose baseline
       finishes in under 5 s, at least 4 in 5..60 s, and at least 2 above 60 s
       or hitting the evaluation timeout, so that reduction is measured on both
       cheap and expensive models.
    P5 Size: |subset| = subset_size models. Ties inside a family/cost bucket are
       broken by a deterministic draw with the seed below.
  The criterion uses only baseline (unreduced) information, which is available
  before SymView produces any suggestion.

subset_size: 20
seed: 20261106
timeout_probe_s: 40

